<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
  <title id="t">Extra taxable income created by the 90 percent rule</title>
  <desc id="d">For someone with $50,000 in gambling winnings, the extra taxable income created by the 90 percent rule rises from zero at zero losses to $5,000 at $50,000 in losses, then falls back to zero at about $55,556 in losses and stays at zero beyond that.</desc>
  <rect width="760" height="380" rx="14" fill="#0e2419"/>
  <text x="380" y="40" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#edf2ee">Extra taxable income from the 90% rule</text>
  <text x="380" y="62" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#9fb0a6">Example: $50,000 in winnings</text>
  <g stroke="#1c4a30" stroke-width="1">
    <line x1="80" y1="300" x2="700" y2="300"/>
    <line x1="80" y1="227" x2="700" y2="227"/>
    <line x1="80" y1="153" x2="700" y2="153"/>
    <line x1="80" y1="80" x2="700" y2="80"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#9fb0a6" text-anchor="end">
    <text x="70" y="304">$0</text>
    <text x="70" y="231">$2,000</text>
    <text x="70" y="157">$4,000</text>
    <text x="70" y="84">$6,000</text>
  </g>
  <polygon points="80,300 596.7,116.7 654.1,300" fill="#35d07a" fill-opacity="0.25"/>
  <polyline points="80,300 596.7,116.7 654.1,300 700,300" fill="none" stroke="#56db92" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="596.7" cy="116.7" r="6" fill="#56db92"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#9fb0a6" text-anchor="middle">
    <text x="80" y="322">$0</text>
    <text x="287" y="322">$20,000</text>
    <text x="494" y="322">$40,000</text>
    <text x="700" y="322">$60,000</text>
  </g>
  <text x="380" y="346" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#dce6df">Total gambling losses for the year</text>
  <g font-family="Inter,Arial,sans-serif">
    <text x="580" y="96" text-anchor="end" font-size="15" font-weight="700" fill="#56db92">Peak: break even, +$5,000 taxed</text>
    <text x="690" y="280" text-anchor="end" font-size="13" fill="#9fb0a6">Zero at about $55,556</text>
  </g>
  <text x="380" y="370" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#77887e">Federal rule, itemizers.  0stakes.com</text>
</svg>
