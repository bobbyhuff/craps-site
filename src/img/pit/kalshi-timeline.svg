<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d">
  <title id="t">Timeline of the Kalshi court fight in 2026</title>
  <desc id="d">February 2026: Nevada files an enforcement action. April 6: Third Circuit rules for Kalshi. August 28: Ninth Circuit rules for Nevada. September 16: Ninth Circuit tribal gaming ruling. October 9: CFTC proposes a rule. Early November: rehearing denied.</desc>
  <rect width="760" height="470" rx="14" fill="#0e2419"/>
  <text x="380" y="44" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600" fill="#edf2ee">The Kalshi court fight, 2026</text>
  <line x1="200" y1="80" x2="200" y2="420" stroke="#1c4a30" stroke-width="4"/>
  <g font-family="Inter,Arial,sans-serif">
    <circle cx="200" cy="100" r="9" fill="#35d07a"/>
    <text x="180" y="106" text-anchor="end" font-size="18" font-weight="700" fill="#56db92">Feb</text>
    <text x="226" y="100" font-size="17" font-weight="600" fill="#edf2ee">Nevada files enforcement suit</text>
    <text x="226" y="122" font-size="14" fill="#9fb0a6">State court action against Kalshi</text>

    <circle cx="200" cy="170" r="9" fill="#35d07a"/>
    <text x="180" y="176" text-anchor="end" font-size="18" font-weight="700" fill="#56db92">Apr 6</text>
    <text x="226" y="170" font-size="17" font-weight="600" fill="#edf2ee">Third Circuit sides with Kalshi</text>
    <text x="226" y="192" font-size="14" fill="#9fb0a6">Likely swaps; New Jersey blocked (2 to 1)</text>

    <circle cx="200" cy="240" r="9" fill="#35d07a"/>
    <text x="180" y="246" text-anchor="end" font-size="18" font-weight="700" fill="#56db92">Aug 28</text>
    <text x="226" y="240" font-size="17" font-weight="600" fill="#edf2ee">Ninth Circuit sides with Nevada</text>
    <text x="226" y="262" font-size="14" fill="#9fb0a6">Likely not swaps; state can enforce</text>

    <circle cx="200" cy="310" r="9" fill="#35d07a"/>
    <text x="180" y="316" text-anchor="end" font-size="18" font-weight="700" fill="#56db92">Sep 16</text>
    <text x="226" y="310" font-size="17" font-weight="600" fill="#edf2ee">Tribal gaming ruling</text>
    <text x="226" y="332" font-size="14" fill="#9fb0a6">Two California tribes likely to win on IGRA</text>

    <circle cx="200" cy="380" r="9" fill="#35d07a"/>
    <text x="180" y="386" text-anchor="end" font-size="18" font-weight="700" fill="#56db92">Oct 9</text>
    <text x="226" y="380" font-size="17" font-weight="600" fill="#edf2ee">CFTC proposes event contract rule</text>
    <text x="226" y="402" font-size="14" fill="#9fb0a6">Comments due Nov 18</text>

    <circle cx="200" cy="440" r="9" fill="#35d07a"/>
    <text x="180" y="446" text-anchor="end" font-size="18" font-weight="700" fill="#56db92">Nov</text>
    <text x="226" y="446" font-size="17" font-weight="600" fill="#edf2ee">Ninth Circuit denies rehearing</text>
  </g>
  <text x="380" y="466" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#77887e">0stakes.com</text>
</svg>
